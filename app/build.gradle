plugins {
    id 'com.android.application'
}

android {
    namespace 'com.batteryadaptive.lsp'
    compileSdk 34

    defaultConfig {
        applicationId "com.batteryadaptive.lsp"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            // 使用默认 debug keystore，保证 release 包也可直接安装
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
