plugins {
    id 'com.android.application'
}

android {
    namespace 'com.batteryadaptive.lsp'
    compileSdk 37

    defaultConfig {
        applicationId "com.batteryadaptive.lsp"
        minSdk 27
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        debug {
            // 使用默认 debug keystore，保证 release 包也可直接安装
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // libxposed 现代 API：由框架在目标进程注入，必须 compileOnly
    compileOnly 'io.github.libxposed:api:102.0.0'
    compileOnly 'io.github.libxposed:annotation:1.0.0'
    compileOnly 'androidx.annotation:annotation:1.8.0'
    // 模块 App 侧与 LSPosed 守护进程通信（写远程配置），必须打包
    implementation 'io.github.libxposed:service:102.0.0'
}
